description: XtremIO was an Israeli all-flash enterprise storage company founded in 2009
  and acquired by EMC in May 2012 for $430 million, with the technology continuing as the
  Dell EMC XtremIO all-flash array product line. Surfaced in the API Evangelist network as
  a portfolio company of Battery Ventures and Lightspeed Venture Partners, XtremIO no longer
  operates independently and publishes no public developer program — xtremio.com is a parked
  domain retained under Dell brand protection, with DNS still actively managed by Dell.
